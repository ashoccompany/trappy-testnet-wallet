<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trappy Testnet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0e1621;
      --card-bg: #17212b;
      --card-hover: #202b36;
      --text-main: #ffffff;
      --text-muted: #7f91a4;
      --accent-blue: #2481cc;
      --accent-green: #31b545;
      --accent-orange: #f5a623;
      --border-color: #242f3d;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(36, 129, 204, 0.15);
      color: var(--accent-blue);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .wallet-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .portfolio-card {
      background: linear-gradient(135deg, #1d2733 0%, #17212b 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 26px 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .portfolio-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .portfolio-value {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .action-btn:active {
      transform: scale(0.96);
      background: var(--card-hover);
    }
    .action-icon {
      font-size: 22px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .asset-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .asset-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .asset-card:active {
      background: var(--card-hover);
    }
    .asset-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .asset-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #242f3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .asset-info h4 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .asset-info p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .asset-right {
      text-align: right;
    }
    .asset-balance {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .asset-usd {
      font-size: 13px;
      color: var(--text-muted);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(23, 33, 43, 0.95);
      border: 1px solid var(--accent-blue);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">⚡ Trappy Testnet</div>
    <div class="wallet-chip" id="walletId" onclick="copyWallet()">Wallet: TRP-9051</div>
  </div>

  <div class="portfolio-card">
    <div class="portfolio-label">Total Testnet Balance</div>
    <div class="portfolio-value" id="totalUsd">$0.00</div>
  </div>

  <div class="action-grid">
    <div class="action-btn" onclick="sendAction()">
      <div class="action-icon">📤</div>
      <span>Send</span>
    </div>
    <div class="action-btn" onclick="depositAction()">
      <div class="action-icon">📥</div>
      <span>Deposit</span>
    </div>
    <div class="action-btn" onclick="giveawayAction()">
      <div class="action-icon">🎁</div>
      <span>Giveaway</span>
    </div>
  </div>

  <div class="section-title">
    <span>Assets</span>
    <span style="font-size: 12px; color: var(--text-muted);">3 Cryptos</span>
  </div>

  <div class="asset-list" id="assetList">
    <!-- Assets dynamically inserted -->
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.setHeaderColor('#0e1621');
      tg.setBackgroundColor('#0e1621');
    }

    const cryptos = [
      { sym: 'USDT', name: 'Tether', icon: '💵', rate: 1.0, bal: 0 },
      { sym: 'TRX', name: 'TRON', icon: '🔴', rate: 0.16, bal: 0 },
      { sym: 'TRAPPY', name: 'Trappy', icon: '⚡', rate: 0.25, bal: 0 }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const rawWallet = urlParams.get('wallet') || 'TRP-9051';
    document.getElementById('walletId').innerText = 'Wallet: ' + rawWallet;

    let totalUsdVal = 0;

    cryptos.forEach(c => {
      const p = urlParams.get(c.sym.toLowerCase());
      if (p) c.bal = parseFloat(p) || 0;
      totalUsdVal += c.bal * c.rate;
    });

    document.getElementById('totalUsd').innerText = '$' + totalUsdVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    const container = document.getElementById('assetList');
    container.innerHTML = cryptos.map(c => `
      <div class="asset-card" onclick="openAsset('${c.sym}')">
        <div class="asset-left">
          <div class="asset-logo">${c.icon}</div>
          <div class="asset-info">
            <h4>${c.name}</h4>
            <p>${c.sym}</p>
          </div>
        </div>
        <div class="asset-right">
          <div class="asset-balance">${c.bal.toLocaleString()} ${c.sym}</div>
          <div class="asset-usd">$${(c.bal * c.rate).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
        </div>
      </div>
    `).join('');

    function copyWallet() {
      navigator.clipboard.writeText(rawWallet);
      showToast('Wallet ID copied!');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    function sendAction() {
      if (tg) tg.close();
      alert("In chat, type: @TrappyTestnet $10 @username");
    }

    function depositAction() {
      if (tg) tg.close();
      alert("Tap [Deposit] in the bot to receive free testnet coins!");
    }

    function giveawayAction() {
      if (tg) tg.close();
      alert("In chat, type: @TrappyTestnet giveaway 1000 TRAPPY 5");
    }

    function openAsset(sym) {
      showToast('Selected ' + sym);
    }
  </script>
</body>
</html>
